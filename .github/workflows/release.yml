name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build xWinAmp.app
        run: VERSION=${{ github.ref_name }} scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/xWinAmp-macos.zip

  linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ALSA and X11 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev
      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/xwinamp ./cmd/xwinamp
          tar -czf dist/xwinamp-linux-amd64.tar.gz -C dist xwinamp
          # -H=windowsgui: no console window behind the player.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/xwinamp.exe ./cmd/xwinamp
          (cd dist && zip -q xwinamp-windows-amd64.zip xwinamp.exe)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            dist/xwinamp-linux-amd64.tar.gz
            dist/xwinamp-windows-amd64.zip

  release:
    needs: [macos, linux-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
