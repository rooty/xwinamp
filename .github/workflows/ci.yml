name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ALSA and X11 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-build for Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build xWinAmp.app
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xWinAmp-app
          path: dist/xWinAmp-macos.zip
          retention-days: 7
